{% extends 'mailing/base.html' %}
{% block content %}

<div class="container mt-5">
    <div class="row">
        <div class="col-6">
            <form class="row" method="post" enctype="multipart/form-data">
                <div class="card">
                    {% if object %}
                    <h2 class="mb-4">Редактирование Рассылки</h2>
                    {% else %}
                    <h2 class="mb-4">Создание Рассылки</h2>
                    {% endif %}
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-primary mb-2">Сохранить</button>
                        <a class="btn btn-primary mb-2" href="{% url 'mailing:mailing_list' %}">Отмена</a>
                    </form>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
